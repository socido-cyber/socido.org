<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="ray" d="M 100 22 C 112 22, 118 38, 114 54 C 110 70, 100 84, 100 84 C 100 84, 90 70, 86 54 C 82 38, 88 22, 100 22 Z" />
  </defs>

  <!-- 8 Rays: 4 pairs in 180-deg mirrored symmetry -->
  <use href="#ray" fill="#F59E0B" />
  <use href="#ray" fill="#F43F5E" transform="rotate(45 100 100)" />
  <use href="#ray" fill="#0284C7" transform="rotate(90 100 100)" />
  <use href="#ray" fill="#10B981" transform="rotate(135 100 100)" />
  <use href="#ray" fill="#F59E0B" transform="rotate(180 100 100)" />
  <use href="#ray" fill="#F43F5E" transform="rotate(225 100 100)" />
  <use href="#ray" fill="#0284C7" transform="rotate(270 100 100)" />
  <use href="#ray" fill="#10B981" transform="rotate(315 100 100)" />

  <!-- Clean Harmonizing Center Sun -->
  <circle cx="100" cy="100" r="30" fill="#ffffff" />
  <circle cx="100" cy="100" r="23" fill="#F59E0B" />
  <circle cx="100" cy="100" r="14" fill="#ffffff" />
  <circle cx="100" cy="100" r="7" fill="#0284C7" />
</svg>

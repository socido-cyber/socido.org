<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 4 Symmetrical Overlapping Rings -->
  <!-- Top: Coral Rose -->
  <circle cx="100" cy="70" r="42" fill="none" stroke="#F43F5E" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <!-- Right: Amber Gold -->
  <circle cx="130" cy="100" r="42" fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <!-- Bottom: Emerald Jade -->
  <circle cx="100" cy="130" r="42" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <!-- Left: Ocean Azure -->
  <circle cx="70" cy="100" r="42" fill="none" stroke="#0EA5E9" stroke-width="14" stroke-linecap="round" opacity="0.95"/>

  <!-- Center Core Star/Sun -->
  <circle cx="100" cy="100" r="14" fill="#ffffff"/>
  <circle cx="100" cy="100" r="9" fill="#8B5CF6"/>
</svg>
